<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Boy Snake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation; /* Prevents double-tap zoom */
        }

        body {
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* Game Boy Casing */
        .gameboy {
            background-color: #dedede;
            width: 360px;
            height: 600px;
            border-radius: 10px 10px 50px 10px;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1), 
                        inset 5px 5px 15px rgba(255,255,255,0.8), 
                        10px 10px 30px rgba(0,0,0,0.3);
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Grooves */
        .gameboy::before {
            content: '';
            position: absolute;
            top: 0; left: 20px; right: 20px; height: 10px;
            border-bottom: 2px solid #b5b5b5;
            border-radius: 5px;
        }

        /* Screen Bezel */
        .screen-bezel {
            background-color: #555;
            width: 100%;
            height: 250px;
            border-radius: 10px 10px 40px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
        }

        .screen-header {
            color: #b3b3b3;
            font-size: 10px;
            font-family: Arial, sans-serif;
            letter-spacing: 1px;
            margin-bottom: 10px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .battery-light {
            width: 8px;
            height: 8px;
            background-color: #ff3333;
            border-radius: 50%;
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 5px #ff3333;
        }

        .battery-text {
            position: absolute;
            left: -5px;
            top: 15px;
            font-size: 8px;
            color: #b3b3b3;
        }

        /* The Actual Screen */
        .screen {
            background-color: #9bbc0f;
            width: 200px;
            height: 180px;
            box-shadow: inset 3px 3px 10px rgba(0,0,0,0.3);
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        .brand-logo {
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 14px;
            font-style: italic;
            color: #3b3180;
            margin-top: 15px;
            width: 100%;
            padding-left: 10px;
        }

        /* Controls Area */
        .controls {
            width: 100%;
            height: 150px;
            position: relative;
            margin-top: 20px;
        }

        /* D-Pad */
        .dpad {
            position: absolute;
            left: 20px;
            top: 20px;
            width: 90px;
            height: 90px;
        }

        .dpad-btn {
            background-color: #222;
            position: absolute;
            cursor: pointer;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.2);
        }

        .dpad-btn:active {
            background-color: #111;
        }

        .dpad-up { top: 0; left: 30px; width: 30px; height: 40px; border-radius: 5px 5px 0 0; }
        .dpad-down { bottom: 0; left: 30px; width: 30px; height: 40px; border-radius: 0 0 5px 5px; }
        .dpad-left { top: 30px; left: 0; width: 40px; height: 30px; border-radius: 5px 0 0 5px; }
        .dpad-right { top: 30px; right: 0; width: 40px; height: 30px; border-radius: 0 5px 5px 0; }
        .dpad-center { 
            position: absolute; top: 30px; left: 30px; width: 30px; height: 30px; 
            background-color: #222; z-index: 1;
        }
        
        /* Inner texture for D-Pad center */
        .dpad-center::after {
            content: '';
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            background: repeating-linear-gradient(45deg, #111, #111 2px, transparent 2px, transparent 4px);
            border-radius: 50%;
        }

        /* Action Buttons (A / B) */
        .action-btns {
            position: absolute;
            right: 15px;
            top: 30px;
            width: 120px;
            height: 60px;
            transform: rotate(-20deg);
        }

        .btn-round {
            width: 45px;
            height: 45px;
            background-color: #990033;
            border-radius: 50%;
            position: absolute;
            box-shadow: 2px 3px 5px rgba(0,0,0,0.4), inset -2px -2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .btn-round:active {
            box-shadow: 1px 1px 2px rgba(0,0,0,0.4), inset -2px -2px 5px rgba(0,0,0,0.5);
            transform: translateY(2px);
        }

        .btn-b { left: 0; top: 15px; }
        .btn-a { right: 0; top: -5px; }

        .btn-label {
            position: absolute;
            bottom: -25px;
            right: 10px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #3b3180;
            font-size: 14px;
        }

        /* Start / Select Buttons */
        .sys-btns {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            transform: rotate(-20deg);
            padding-right: 40px;
        }

        .btn-sys-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-pill {
            width: 45px;
            height: 12px;
            background-color: #777;
            border-radius: 10px;
            box-shadow: 1px 2px 3px rgba(0,0,0,0.3), inset -1px -1px 2px rgba(0,0,0,0.2);
            cursor: pointer;
            margin-bottom: 5px;
        }

        .btn-pill:active {
            box-shadow: inset -1px -1px 2px rgba(0,0,0,0.4);
            transform: translateY(1px);
        }

        .sys-label {
            font-family: Arial, sans-serif;
            font-size: 10px;
            color: #3b3180;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Speaker grill */
        .speaker {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 60px;
            display: flex;
            justify-content: space-between;
            transform: rotate(-25deg);
        }

        .grill {
            width: 6px;
            height: 40px;
            background-color: #aaa;
            border-radius: 3px;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.3);
        }

        /* Instructions */
        .desktop-hint {
            position: absolute;
            bottom: 10px;
            font-size: 12px;
            color: #666;
            text-align: center;
            width: 100%;
        }

        @media (max-width: 400px) {
            .gameboy { transform: scale(0.9); margin-top: -30px; }
            .desktop-hint { display: none; }
        }
    </style>
</head>
<body>

    <div class="gameboy">
        <div class="screen-bezel">
            <div class="screen-header">
                <div class="battery-light">
                    <span class="battery-text"></span>
                </div>
            </div>
            <div class="screen">
                <canvas id="gameCanvas" width="160" height="144"></canvas>
            </div>
        </div>
        
        <div class="brand-logo">Nintendo GAME BOY<span style="font-size:8px">TM</span></div>

        <div class="controls">
            <div class="dpad">
                <div class="dpad-center"></div>
                <div class="dpad-btn dpad-up" id="btn-up"></div>
                <div class="dpad-btn dpad-down" id="btn-down"></div>
                <div class="dpad-btn dpad-left" id="btn-left"></div>
                <div class="dpad-btn dpad-right" id="btn-right"></div>
            </div>

            <div class="action-btns">
                <div class="btn-round btn-b" id="btn-b">
                    <div class="btn-label">B</div>
                </div>
                <div class="btn-round btn-a" id="btn-a">
                    <div class="btn-label">A</div>
                </div>
            </div>
        </div>

        <div class="sys-btns">
            <div class="btn-sys-container">
                <div class="btn-pill" id="btn-select"></div>
                <div class="sys-label">SELECT</div>
            </div>
            <div class="btn-sys-container">
                <div class="btn-pill" id="btn-start"></div>
                <div class="sys-label">START</div>
            </div>
        </div>

        <div class="speaker">
            <div class="grill"></div>
            <div class="grill"></div>
            <div class="grill"></div>
            <div class="grill"></div>
            <div class="grill"></div>
            <div class="grill"></div>
        </div>
    </div>

    <div class="desktop-hint">Keyboard: Arrows to move/navigate. 'Z' for A, 'X' for B, 'Enter' for Start.</div>

    <script>
        // --- Canvas & Colors ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Classic GB Palette
        const colors = {
            lightest: '#9bbc0f',
            light: '#8bac0f',
            dark: '#306230',
            darkest: '#0f380f'
        };

        // --- Game Variables ---
        const blockSize = 8;
        const gridW = 160 / blockSize; // 20
        const gridH = 144 / blockSize; // 18

        let state = 'MENU'; // MENU, DIFFICULTY, SCORES, PLAY, OVER
        let menuIndex = 0;
        
        const difficulties = [
            { name: "EASY", speed: 150 },
            { name: "NORMAL", speed: 100 },
            { name: "HARD", speed: 60 }
        ];
        let currentDiff = 1; // Default Normal
        
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 1, dy = 0;
        let nextDx = 1, nextDy = 0;
        let score = 0;
        let gameLoopTimeout;
        let lastFrameTime = 0;

        // Load High Scores
        let highScores = JSON.parse(localStorage.getItem('gbSnakeScores')) || [];

        // Wait for font to load before first draw to prevent glitchy text
        document.fonts.load('10px "Press Start 2P"').then(() => { draw(); });

        // --- Audio System ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'eat') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'die') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'blip') {
                // UI interaction sound
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        // --- Drawing Engine ---
        function clearCanvas() {
            ctx.fillStyle = colors.lightest;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawText(text, x, y, size = 8, align = 'left') {
            ctx.fillStyle = colors.darkest;
            ctx.font = `${size}px "Press Start 2P", monospace`;
            ctx.textAlign = align;
            ctx.fillText(text, x, y);
        }

        function draw() {
            clearCanvas();

            if (state === 'MENU') {
                drawText("SNAKE", 80, 40, 16, 'center');
                const options = ["PLAY", "DIFFICULTY", "HIGH SCORES"];
                options.forEach((opt, i) => {
                    drawText(opt, 50, 80 + (i * 20));
                    if (i === menuIndex) drawText(">", 35, 80 + (i * 20));
                });
            } 
            else if (state === 'DIFFICULTY') {
                drawText("DIFFICULTY", 80, 30, 10, 'center');
                difficulties.forEach((diff, i) => {
                    drawText(diff.name, 50, 70 + (i * 20));
                    if (i === menuIndex) drawText(">", 35, 70 + (i * 20));
                    if (i === currentDiff) drawText("*", 130, 70 + (i * 20)); // current selected
                });
                drawText("Press B to return", 80, 135, 6, 'center');
            }
            else if (state === 'SCORES') {
                drawText("TOP SCORES", 80, 25, 10, 'center');
                if (highScores.length === 0) {
                    drawText("NO SCORES YET", 80, 70, 8, 'center');
                } else {
                    highScores.slice(0, 5).forEach((sc, i) => {
                        drawText(`${i+1}.${sc.score} (${sc.diff})`, 25, 50 + (i * 15));
                    });
                }
                drawText("Press B to return", 80, 135, 6, 'center');
            }
            else if (state === 'PLAY') {
                // Draw Food
                ctx.fillStyle = colors.darkest;
                ctx.fillRect(food.x * blockSize + 1, food.y * blockSize + 1, blockSize - 2, blockSize - 2);

                // Draw Snake
                snake.forEach((segment, i) => {
                    ctx.fillStyle = i === 0 ? colors.darkest : colors.dark;
                    ctx.fillRect(segment.x * blockSize, segment.y * blockSize, blockSize - 1, blockSize - 1);
                });

                // HUD Score
                drawText(score.toString(), 155, 12, 8, 'right');
            }
            else if (state === 'OVER') {
                drawText("GAME OVER", 80, 50, 12, 'center');
                drawText(`SCORE: ${score}`, 80, 80, 8, 'center');
                drawText("Press A/START", 80, 110, 8, 'center');
            }
        }

        // --- Game Logic ---
        function startGame() {
            snake = [
                { x: 10, y: 9 }, { x: 9, y: 9 }, { x: 8, y: 9 }
            ];
            dx = 1; dy = 0; nextDx = 1; nextDy = 0;
            score = 0;
            placeFood();
            state = 'PLAY';
            clearTimeout(gameLoopTimeout);
            gameLoop();
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * gridW);
                food.y = Math.floor(Math.random() * gridH);
                valid = true;
                for (let s of snake) {
                    if (s.x === food.x && s.y === food.y) { valid = false; break; }
                }
            }
        }

        function gameOver() {
            state = 'OVER';
            playSound('die');
            
            // Save score
            highScores.push({ score: score, diff: difficulties[currentDiff].name.substring(0,3) });
            highScores.sort((a, b) => b.score - a.score);
            highScores = highScores.slice(0, 5); // Keep top 5
            localStorage.setItem('gbSnakeScores', JSON.stringify(highScores));
            draw();
        }

        function gameLoop() {
            if (state !== 'PLAY') return;

            dx = nextDx; dy = nextDy;
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision
            if (head.x < 0 || head.x >= gridW || head.y < 0 || head.y >= gridH) {
                return gameOver();
            }

            // Self Collision
            for (let s of snake) {
                if (s.x === head.x && s.y === head.y) return gameOver();
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                playSound('eat');
                placeFood();
            } else {
                snake.pop();
            }

            draw();
            gameLoopTimeout = setTimeout(gameLoop, difficulties[currentDiff].speed);
        }

        // --- Input Handling ---
        function handleInput(input) {
            initAudio(); // Activate audio on first interaction
            
            if (state === 'MENU') {
                if (input === 'UP') { menuIndex = (menuIndex - 1 + 3) % 3; playSound('blip'); }
                if (input === 'DOWN') { menuIndex = (menuIndex + 1) % 3; playSound('blip'); }
                if (input === 'A' || input === 'START') {
                    playSound('blip');
                    if (menuIndex === 0) startGame();
                    else if (menuIndex === 1) { state = 'DIFFICULTY'; menuIndex = currentDiff; }
                    else if (menuIndex === 2) { state = 'SCORES'; }
                }
            } 
            else if (state === 'DIFFICULTY') {
                if (input === 'UP') { menuIndex = (menuIndex - 1 + 3) % 3; playSound('blip'); }
                if (input === 'DOWN') { menuIndex = (menuIndex + 1) % 3; playSound('blip'); }
                if (input === 'A' || input === 'START') {
                    currentDiff = menuIndex;
                    playSound('blip');
                    state = 'MENU';
                    menuIndex = 1;
                }
                if (input === 'B') { state = 'MENU'; menuIndex = 1; playSound('blip'); }
            }
            else if (state === 'SCORES') {
                if (input === 'B' || input === 'A' || input === 'START') {
                    state = 'MENU';
                    menuIndex = 2;
                    playSound('blip');
                }
            }
            else if (state === 'PLAY') {
                if (input === 'UP' && dy === 0) { nextDx = 0; nextDy = -1; }
                if (input === 'DOWN' && dy === 0) { nextDx = 0; nextDy = 1; }
                if (input === 'LEFT' && dx === 0) { nextDx = -1; nextDy = 0; }
                if (input === 'RIGHT' && dx === 0) { nextDx = 1; nextDy = 0; }
            }
            else if (state === 'OVER') {
                if (input === 'A' || input === 'START') {
                    state = 'MENU';
                    menuIndex = 0;
                    playSound('blip');
                }
            }
            
            if (state !== 'PLAY') draw(); // Force UI update
        }

        // Event Listeners - Keyboard
        window.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': case 'w': case 'W': handleInput('UP'); break;
                case 'ArrowDown': case 's': case 'S': handleInput('DOWN'); break;
                case 'ArrowLeft': case 'a': case 'A': handleInput('LEFT'); break;
                case 'ArrowRight': case 'd': case 'D': handleInput('RIGHT'); break;
                case 'z': case 'Z': handleInput('A'); break;
                case 'x': case 'X': handleInput('B'); break;
                case 'Enter': handleInput('START'); break;
                case 'Shift': handleInput('SELECT'); break;
            }
        });

        // Event Listeners - On-Screen Buttons
        const bindBtn = (id, input) => {
            const btn = document.getElementById(id);
            // Touch & Mouse
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(input); }, {passive: false});
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); handleInput(input); });
        };

        bindBtn('btn-up', 'UP');
        bindBtn('btn-down', 'DOWN');
        bindBtn('btn-left', 'LEFT');
        bindBtn('btn-right', 'RIGHT');
        bindBtn('btn-a', 'A');
        bindBtn('btn-b', 'B');
        bindBtn('btn-start', 'START');
        bindBtn('btn-select', 'SELECT');

        // Initial Draw
        draw();

    </script>
</body>
</html>
